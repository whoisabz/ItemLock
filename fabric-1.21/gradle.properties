# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# This variant targets the 1.21 - 1.21.9 API generation: String keybind category,
# ResourceLocation (pre-Identifier rename), and no AbstractContainerScreen#renderContents.
minecraft_version=1.21
loader_version=0.18.4
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.9.2+1.21
maven_group=net.pvplock

# Dependencies
fabric_api_version=0.102.0+1.21
