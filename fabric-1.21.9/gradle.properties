# ResourceLocation (pre-Identifier rename), and no AbstractContainerScreen#renderContents.
minecraft_version=1.21.10
loader_version=0.18.4
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.9.0+1.21.9
maven_group=net.pvplock

# Dependencies
fabric_api_version=0.138.4+1.21.10
