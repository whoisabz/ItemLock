# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml
modLoader="javafml"
loaderVersion="[61,)"
license="CC0-1.0"
issueTrackerURL="https://github.com/whoisabz/ItemLock/issues" #optional

[[mods]]
modId="pvplockmod"
version="${file.jarVersion}"
displayName="ItemLock"
logoFile="pvplockmod.png"
authors="abz"

description='''Press O to lock a hotbar slot in place so you can't accidentally drop or move that item during PvP fights.'''

[[dependencies.pvplockmod]] #recommended
    modId="forge"
    mandatory=true
    versionRange="[61,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.pvplockmod]] #recommended
    modId="minecraft"
    mandatory=true
    # 1.21.11 only. A future 1.21.12 would be a different API generation and needs its
    # own build - claiming versions that were never tested is what got this project
    # rejected from Modrinth once.
    versionRange="[1.21.11,1.21.12)"
    ordering="NONE"
    side="BOTH"
